notes:
  - This graph records who reads which Markdown/control-plane docs.
  - auto_loaded means the consumer is expected to read it without extra human direction.
  - referenced means the doc is discoverable/consulted, but not part of mandatory startup.
  - runtime_refs are non-repo or runtime-located docs/paths; leave TODO placeholders instead of guessing.
consumers:
